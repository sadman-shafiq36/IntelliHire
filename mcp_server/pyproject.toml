[project]
name = "intellihire-mcp"
version = "0.1.0"
description = "IntelliHire MCP server: Gmail and Google Calendar tools for interview scheduling"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "C4", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["google_api", "mailer", "server", "settings"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q --strict-markers"
