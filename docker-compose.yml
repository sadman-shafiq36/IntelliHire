# cp .env.example .env
# docker compose up --build
#
# frontend  http://localhost:5173
# api docs  http://localhost:8000/docs
# mailhog   http://localhost:8025
#
# data lives in named volumes, `down -v` resets everything

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - pg_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  chroma:
    # keep in step with the chromadb client pin in backend/requirements.txt
    image: chromadb/chroma:1.5.9
    restart: unless-stopped
    environment:
      ANONYMIZED_TELEMETRY: "FALSE"
    volumes:
      - chroma_data:/data
    ports:
      - "8001:8000"
    healthcheck:
      test: ["CMD", "/bin/bash", "-c", "exec 3<>/dev/tcp/localhost/8000"]
      interval: 15s
      timeout: 5s
      retries: 5

  # catches outgoing invitation emails locally, viewable at :8025
  mailhog:
    image: mailhog/mailhog:v1.0.1
    restart: unless-stopped
    ports:
      - "1025:1025"
      - "8025:8025"

  whisper:
    build:
      context: ./whisper_service
    restart: unless-stopped
    environment:
      WHISPER_MODEL_SIZE: ${WHISPER_MODEL_SIZE}
      WHISPER_COMPUTE_TYPE: ${WHISPER_COMPUTE_TYPE}
    volumes:
      - whisper_models:/models
    ports:
      - "9000:9000"

  # video rooms for the interviews. browsers reach it on 7880 (signalling) and 7881/tcp,
  # 7882/udp (media). node_ip is the address it gives browsers for media; the container's
  # own address is offered as well, which is what the transcriber uses
  livekit:
    image: livekit/livekit-server:v1.13.7
    restart: unless-stopped
    environment:
      LIVEKIT_CONFIG: |
        port: 7880
        rtc:
          tcp_port: 7881
          udp_port: 7882
          use_external_ip: false
          node_ip: ${LIVEKIT_NODE_IP:-127.0.0.1}
          advertise_internal_ip: true
        keys:
          ${LIVEKIT_API_KEY}: ${LIVEKIT_API_SECRET}
        webhook:
          api_key: ${LIVEKIT_API_KEY}
          urls:
            - http://backend:8000/api/v1/livekit/webhook
        room:
          empty_timeout: 300
          departure_timeout: 60
        logging:
          level: info
    ports:
      - "7880:7880"
      - "7881:7881"
      - "7882:7882/udp"

  # mcp server with the gmail, google calendar and smtp tools the scheduling agent uses.
  # no published port: only the backend and worker on this network can reach it
  mcp:
    build:
      context: ./mcp_server
    restart: unless-stopped
    environment:
      MCP_SHARED_SECRET: ${MCP_SHARED_SECRET}
      SMTP_HOST: mailhog
      SMTP_PORT: ${SMTP_PORT}
      SMTP_USER: ${SMTP_USER}
      SMTP_PASSWORD: ${SMTP_PASSWORD}
      SMTP_USE_TLS: ${SMTP_USE_TLS}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME}
    volumes:
      - ./mcp_server:/app
    command: ["uvicorn", "server:app", "--host", "0.0.0.0", "--port", "8100", "--reload"]

  backend:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      # compose service names override .env so the same .env works outside docker
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chroma
      SMTP_HOST: mailhog
      WHISPER_SERVICE_URL: http://whisper:9000
      MCP_SERVER_URL: http://mcp:8100/mcp
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
      STORAGE_DIR: /data/storage
    volumes:
      - ./backend:/app
      - app_storage:/data/storage
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload"

  # long ai work (cv batches, assessments) runs here, not in the request
  worker:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      CHROMA_HOST: chroma
      SMTP_HOST: mailhog
      WHISPER_SERVICE_URL: http://whisper:9000
      MCP_SERVER_URL: http://mcp:8100/mcp
      STORAGE_DIR: /data/storage
    volumes:
      - ./backend:/app
      - app_storage:/data/storage
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      chroma:
        condition: service_started
    command: ["python", "-m", "app.worker.run"]
    # the backend image's healthcheck curls :8000 which the worker doesn't serve,
    # so check that the worker registered itself in redis instead
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import sys; from rq import Worker;
          from app.worker.queue import get_redis;
          sys.exit(0 if Worker.all(connection=get_redis()) else 1)"
      interval: 30s
      timeout: 10s
      start_period: 30s
      retries: 3

  # joins each live interview room, sends speech to groq (local whisper if groq is down)
  # and saves the transcript
  transcriber:
    build:
      context: ./backend
      target: dev
    restart: unless-stopped
    env_file: .env
    environment:
      POSTGRES_HOST: postgres
      REDIS_HOST: redis
      WHISPER_SERVICE_URL: http://whisper:9000
      LIVEKIT_URL: ${LIVEKIT_URL:-http://livekit:7880}
    volumes:
      - ./backend:/app
    depends_on:
      livekit:
        condition: service_started
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: ["python", "-m", "app.realtime.run"]
    healthcheck:
      test:
        - "CMD-SHELL"
        - >-
          python -c "import sys; from app.worker.queue import get_redis;
          sys.exit(0 if get_redis().exists('transcriber:alive') else 1)"
      interval: 30s
      timeout: 10s
      start_period: 20s
      retries: 3

  frontend:
    build:
      context: ./frontend
      target: dev
    restart: unless-stopped
    environment:
      VITE_API_BASE_URL: ${VITE_API_BASE_URL}
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - backend

  # a public https address for the frontend (and the api behind it), for candidates outside
  # this machine. off by default: docker compose --profile public up -d tunnel
  # the address changes every time this container starts; it's printed in its logs
  tunnel:
    image: cloudflare/cloudflared:2026.10.1
    profiles: ["public"]
    restart: unless-stopped
    command: tunnel --no-autoupdate --url http://frontend:5173
    depends_on:
      - frontend

volumes:
  pg_data:
  redis_data:
  chroma_data:
  app_storage:
  whisper_models:
